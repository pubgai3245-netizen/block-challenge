import json
import math
import re
import subprocess
import sys
import tempfile
import time
import uuid
from pathlib import Path
from urllib.parse import urlparse, parse_qs

import gradio as gr


MAX_BYTES = 200 * 1024 * 1024
MAX_SECONDS = 15 * 60

RESULTS = Path(tempfile.gettempdir()) / "youtube_shorts_results"
RESULTS.mkdir(parents=True, exist_ok=True)

# Only read local MP4/MOV/MKV/WebM media during processing.
INPUT_OPTIONS = [
    "-protocol_whitelist", "file,pipe",
    "-format_whitelist", "mov,matroska,webm",
]


def run_command(arguments, timeout=240):
    result = subprocess.run(
        arguments,
        capture_output=True,
        text=True,
        encoding="utf-8",
        errors="replace",
        check=True,
        timeout=timeout,
    )
    return result.stdout.strip()


def normalize_youtube_url(text):
    """Accept a YouTube video ID, not arbitrary server URLs."""
    parsed = urlparse(text.strip())

    allowed_hosts = {
        "youtube.com",
        "www.youtube.com",
        "m.youtube.com",
        "music.youtube.com",
        "youtu.be",
    }

    if (
        parsed.scheme not in {"http", "https"}
        or parsed.hostname not in allowed_hosts
    ):
        raise gr.Error("সঠিক YouTube video link দাও।")

    parts = parsed.path.strip("/").split("/")

    if parsed.hostname == "youtu.be":
        video_id = parts[0]
    elif len(parts) >= 2 and parts[0] in {"shorts", "live", "embed"}:
        video_id = parts[1]
    else:
        video_id = parse_qs(parsed.query).get("v", [""])[0]

    if not re.fullmatch(r"[A-Za-z0-9_-]{11}", video_id):
        raise gr.Error("Video link পাওয়া যায়নি। Playlist নয়, video link দাও।")

    return f"https://www.youtube.com/watch?v={video_id}"


def clean_old_results():
    files = sorted(
        RESULTS.glob("*.mp4"),
        key=lambda path: path.stat().st_mtime,
        reverse=True,
    )

    for index, path in enumerate(files):
        age = time.time() - path.stat().st_mtime
        if index >= 8 or age > 3600:
            path.unlink(missing_ok=True)


def download_youtube(url, folder):
    output = run_command([
        sys.executable, "-m", "yt_dlp",
        "--no-playlist",
        "--no-simulate",
        "--quiet",
        "--no-warnings",
        "--no-cache-dir",
        "--socket-timeout", "15",
        "--retries", "1",
        "--fragment-retries", "1",
        "--max-filesize", "200M",
        "--match-filter", f"!is_live & duration <= {MAX_SECONDS}",
        "--format", "bv*[height<=720]+ba/b[height<=720]",
        "--merge-output-format", "mp4",
        "--output", str(folder / "source.%(ext)s"),
        "--print", "after_move:filepath",
        url,
    ])

    if not output:
        raise gr.Error(
            "ভিডিও আনা যায়নি। Public, non-live ভিডিও ব্যবহার করো; "
            "সীমা ১৫ মিনিট ও ২০০ MB। প্রয়োজনে ভিডিও upload করো।"
        )

    source = Path(output.splitlines()[-1]).resolve()

    if source.parent != folder.resolve() or not source.is_file():
        raise gr.Error("ডাউনলোডের ফাইল পাওয়া যায়নি।")

    return source


def inspect_video(source):
    information = json.loads(run_command([
        "ffprobe",
        "-v", "error",
        *INPUT_OPTIONS,
        "-show_entries",
        "format=duration:stream=codec_type,width,height",
        "-of", "json",
        str(source),
    ], timeout=30))

    video_streams = [
        stream for stream in information.get("streams", [])
        if stream.get("codec_type") == "video"
    ]

    if not video_streams:
        raise gr.Error("এই ফাইলে ভিডিও পাওয়া যায়নি।")

    duration = float(
        information.get("format", {}).get("duration", 0)
    )

    if not math.isfinite(duration) or duration <= 0:
        raise gr.Error("ভিডিওর duration পড়া যায়নি।")

    if duration > MAX_SECONDS:
        raise gr.Error("ফ্রি demo-তে সর্বোচ্চ ১৫ মিনিটের ভিডিও দাও।")

    return duration


def make_short(
    url,
    uploaded_file,
    start,
    length,
    style,
    progress=gr.Progress(),
):
    clean_old_results()

    output = RESULTS / f"short_{uuid.uuid4().hex}.mp4"
    completed = False

    try:
        start = float(start or 0)
        length = int(length)

        if not math.isfinite(start) or start < 0:
            raise gr.Error("শুরুর সময় ০ বা তার বেশি হতে হবে।")

        if length not in {15, 30, 60}:
            raise gr.Error("১৫, ৩০ অথবা ৬০ সেকেন্ড নির্বাচন করো।")

        with tempfile.TemporaryDirectory(prefix="yt_short_") as temporary:
            folder = Path(temporary)

            progress(0.1, desc="ভিডিও সংগ্রহ করছি...")

            # If an upload is supplied, it takes priority over the link.
            if uploaded_file:
                source = Path(uploaded_file)
            elif url and url.strip():
                source = download_youtube(
                    normalize_youtube_url(url),
                    folder,
                )
            else:
                raise gr.Error("YouTube link দাও অথবা ভিডিও upload করো।")

            if not source.is_file():
                raise gr.Error("ভিডিও ফাইল পাওয়া যায়নি।")

            if source.stat().st_size > MAX_BYTES:
                raise gr.Error("২০০ MB-এর কম সাইজের ভিডিও ব্যবহার করো।")

            duration = inspect_video(source)

            if start >= duration:
                raise gr.Error(
                    f"ভিডিওটি {duration:.1f} সেকেন্ড। "
                    "এর চেয়ে কম start time দাও।"
                )

            actual_length = min(length, duration - start)

            if actual_length < 1:
                raise gr.Error("কমপক্ষে ১ সেকেন্ড ভিডিও বাকি থাকতে হবে।")

            if style == "Blur background":
                video_filter = (
                    "[0:v:0]split=2[bg][fg];"
                    "[bg]scale=720:1280:"
                    "force_original_aspect_ratio=increase,"
                    "crop=720:1280,setsar=1,"
                    "gblur=sigma=20[background];"
                    "[fg]scale=720:1280:"
                    "force_original_aspect_ratio=decrease:"
                    "force_divisible_by=2,setsar=1[foreground];"
                    "[background][foreground]"
                    "overlay=(W-w)/2:(H-h)/2,"
                    "fps=30,format=yuv420p[v]"
                )
            else:
                video_filter = (
                    "[0:v:0]scale=720:1280:"
                    "force_original_aspect_ratio=increase,"
                    "crop=720:1280,setsar=1,"
                    "fps=30,format=yuv420p[v]"
                )

            progress(0.5, desc="9:16 Shorts তৈরি হচ্ছে...")

            run_command([
                "ffmpeg",
                "-y",
                "-nostdin",
                "-v", "error",
                "-filter_complex_threads", "1",
                "-ss", str(start),
                *INPUT_OPTIONS,
                "-i", str(source),
                "-t", str(actual_length),
                "-filter_complex", video_filter,
                "-map", "[v]",
                "-map", "0:a:0?",
                "-c:v", "libx264",
                "-preset", "veryfast",
                "-crf", "23",
                "-threads", "2",
                "-pix_fmt", "yuv420p",
                "-c:a", "aac",
                "-b:a", "128k",
                "-movflags", "+faststart",
                str(output),
            ])

        completed = True
        progress(1, desc="Shorts তৈরি হয়েছে!")

        message = (
            f"তৈরি! শুরু: {start:.1f}s | "
            f"দৈর্ঘ্য: {actual_length:.1f}s | "
            "720 × 1280 MP4। নিচ থেকে download করো।"
        )

        return str(output), str(output), message

    except gr.Error:
        raise

    except subprocess.TimeoutExpired:
        raise gr.Error(
            "সময় বেশি লেগেছে। ছোট ভিডিও দিয়ে আবার চেষ্টা করো।"
        ) from None

    except subprocess.CalledProcessError as error:
        details = (error.stderr or "")[-500:]
        raise gr.Error(
            "Download বা processing ব্যর্থ হয়েছে। "
            "YouTube block/login error হলে ভিডিও upload করো।\n\n"
            + details
        ) from None

    except Exception as error:
        raise gr.Error(
            "সমস্যা হয়েছে: " + str(error)[:500]
        ) from None

    finally:
        if not completed:
            output.unlink(missing_ok=True)


with gr.Blocks(
    title="YouTube Video Link to Shorts",
    delete_cache=(600, 3600),
) as demo:

    gr.Markdown(
        """
        # YouTube Video Link to Shorts
        **Link দাও → সময় বেছে নাও → 9:16 Shorts তৈরি করো**

        নিজের বা ব্যবহারের অনুমতি থাকা ভিডিও ব্যবহার করো।
        সর্বোচ্চ source video: **১৫ মিনিট / ২০০ MB**।
        """
    )

    url = gr.Textbox(
        label="YouTube Video Link",
        placeholder="https://www.youtube.com/watch?v=...",
    )

    uploaded_file = gr.File(
        label="অথবা ভিডিও Upload করো",
        file_types=[".mp4", ".mov", ".mkv", ".webm"],
        type="filepath",
    )

    gr.Markdown(
        "Upload দিলে সেটিই ব্যবহার হবে; YouTube link উপেক্ষা করা হবে।"
    )

    with gr.Row():
        start = gr.Number(
            label="শুরুর সময় — সেকেন্ডে",
            value=0,
            minimum=0,
            precision=0,
        )

        length = gr.Dropdown(
            choices=[15, 30, 60],
            value=30,
            label="Shorts Length — সেকেন্ড",
        )

    style = gr.Radio(
        choices=["Blur background", "Center crop"],
        value="Blur background",
        label="Vertical Style",
    )

    button = gr.Button("✂️ Create Shorts", variant="primary")

    status = gr.Textbox(label="Status", interactive=False)
    preview = gr.Video(label="Shorts Preview")
    download = gr.File(label="Download Shorts MP4")

    button.click(
        fn=make_short,
        inputs=[url, uploaded_file, start, length, style],
        outputs=[preview, download, status],
        concurrency_limit=1,
        api_name=False,
    )

    gr.Markdown(
        "ফাইলগুলো অস্থায়ী—তৈরি হলে download করে রাখো। "
        "এটি clip কাটে; নিজে থেকে viral scene নির্বাচন করে না।"
    )


if __name__ == "__main__":
    demo.queue(
        max_size=2,
        default_concurrency_limit=1,
    ).launch(
        server_name="0.0.0.0",
        server_port=7860,
        max_file_size=MAX_BYTES,
    )
